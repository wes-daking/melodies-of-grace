<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E498" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <linearGradient id="champagneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- MOG Monogram Icon -->
  <g transform="translate(15, 10)">
    <!-- First pillar / Bar 1 -->
    <rect x="0" y="24" width="9" height="52" rx="4.5" fill="url(#goldGradient)" />
    <!-- Center pillar / Bar 2 (Taller) -->
    <rect x="18" y="10" width="9" height="68" rx="4.5" fill="url(#goldGradient)" />
    <!-- Third pillar / Bar 3 with integrated G loop -->
    <path d="M 36 24 
             C 36 20, 42 20, 42 24 
             L 42 56 
             C 42 74, 66 74, 66 56 
             L 66 48 
             L 50 48 
             C 47 48, 47 42, 50 42 
             L 73 42 
             C 76 42, 76 45, 76 48 
             L 76 56 
             C 76 82, 32 82, 32 56 
             L 32 24 
             Z" 
          fill="url(#goldGradient)" />
  </g>

  <!-- Typography: Melodies of Grace -->
  <g transform="translate(115, 20)">
    <!-- Melodies of Grace in Elegant Script/Serif styling -->
    <text x="0" y="38" 
          font-family="'Playfair Display', 'Cinzel', serif" 
          font-size="32" 
          font-style="italic" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="url(#champagneGlow)">
      Melodies of Grace
    </text>

    <!-- Subtitle: ENSEMBLE & BRAND -->
    <text x="3" y="60" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#94A3B8" 
          opacity="0.9">
      MUSICAL ENSEMBLE
    </text>
  </g>
</svg>
